name: Release

# Push a tag such as v1.0.1 (matching the version in package.json) to build the
# Windows installer and publish it as a GitHub release. It can also be run by
# hand from the Actions tab, which tags the current commit with the
# package.json version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $tag"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm test

      - name: Build installer
        run: npm run dist -- --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          generate_release_notes: true
